<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>标星题打印预览 · 套卷研习室</title>
  <link rel="stylesheet" href="./calligraphy.css">
  <link rel="stylesheet" href="./print.css">
  <script defer src="./print.js"></script>
</head>
<body class="print-preview">
  <header class="print-toolbar">
    <div>
      <strong>标星题打印预览</strong>
      <p id="print-status" role="status">正在准备题面…</p>
    </div>
    <div class="print-actions">
      <button id="print-close" type="button">关闭</button>
      <button id="print-now" type="button" disabled>打印 / 保存为 PDF</button>
    </div>
  </header>
  <main id="print-content" class="print-paper" aria-busy="true"></main>
</body>
</html>
